# Reference edge configuration. Nothing here is applied by this pull request:
# the ansible role lands separately. It is the contract the client and the exit
# were written against, so it lives next to them rather than in a wiki.
#
# Everything hard happens here. The exit speaks one dialect of HTTP/1.1 and
# nothing else: no TLS, no HTTP/2, no HTTP/3, no compression, no authentication.
# That is a deliberate split. The parts that are hard to get right and cheap to
# get from someone else — TLS 1.3, ALPN, QUIC, rate limiting, certificates —
# are nginx's job, and the part that has to be fast and exact is 2500 lines of
# Zig with no dependencies.

map $uri $usp_slot {
    default                                            "";
    "~^/proxy/[udc]/(?<slot>[A-Za-z0-9_-])[A-Za-z0-9_-]{21}$"  $slot;
}

# One process per slot, shared nothing. Both legs of a session must reach the
# process that minted its id, and the id starts with that process's slot letter,
# so a plain map does what a stateful load balancer would otherwise be needed
# for. Adding a process is a new letter and a reload.
map $usp_slot $usp_backend {
    default   127.0.0.1:8091;
    "a"       127.0.0.1:8091;
    "b"       127.0.0.1:8092;
    "c"       127.0.0.1:8093;
    "d"       127.0.0.1:8094;
}

# A session opens on whichever process is least busy by luck; the id it answers
# with decides where the rest of the session goes.
split_clients "${request_id}" $usp_open_backend {
    25%     127.0.0.1:8091;
    25%     127.0.0.1:8092;
    25%     127.0.0.1:8093;
    *       127.0.0.1:8094;
}

map $http_authorization $usp_authorized {
    default                                   0;
    "~^Bearer\s+REPLACE_WITH_CLIENT_TOKEN$"   1;
}

limit_req_zone $binary_remote_addr zone=usp_open:10m rate=30r/m;

server {
    listen 443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 ssl;
    listen [::]:443 quic reuseport;

    http2 on;
    http3 on;
    quic_retry on;

    server_name waw.unsafie.com;

    ssl_certificate     /etc/letsencrypt/live/waw.unsafie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waw.unsafie.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:20m;
    ssl_session_tickets on;
    ssl_early_data on;

    # Chrome only tries QUIC after the origin says it can, and stops for a while
    # when it does not work out. Advertising it here is what turns the client's
    # HTTP/3 path on at all.
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # The body is an encrypted byte stream. Compressing it would cost CPU, gain
    # nothing, and make the response look unlike every other Alt-Svc origin.
    gzip off;
    brotli off;

    location /proxy/ {
        if ($usp_authorized = 0) {
            return 401;
        }

        proxy_pass http://$usp_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Usp-Up $http_x_usp_up;
        proxy_set_header X-Usp-Down $http_x_usp_down;
        proxy_set_header X-Usp-Wire $http_x_usp_wire;

        # Both of these are the whole point. Buffering either direction turns a
        # tunnel into a batch job.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 2s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        client_max_body_size 0;
        client_body_timeout 300s;
    }

    location = /proxy/o {
        if ($usp_authorized = 0) {
            return 401;
        }
        limit_req zone=usp_open burst=10 nodelay;

        proxy_pass http://$usp_open_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    location = /proxy/p {
        if ($usp_authorized = 0) {
            return 401;
        }
        return 204;
    }

    # Anything that is not the tunnel gets a real site, because an origin that
    # answers 404 to everything except one long lived POST is a fingerprint of
    # its own.
    location / {
        root /var/www/unsafie;
        try_files $uri $uri/ =404;
    }
}
