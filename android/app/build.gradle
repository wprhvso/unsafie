plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def dotenv = providers.fileContents(
    layout.projectDirectory.file('../../client.env')
).asText.getOrElse('')

def dotenvValue = { String key ->
    def found = ''
    dotenv.eachLine { line ->
        def matcher = line =~ /^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*?)\s*$/
        if (matcher.matches() && matcher.group(1) == key) {
            found = matcher.group(2).replaceAll(/^["']|["']$/, '')
        }
    }
    return found
}

def releaseKeystore = file(System.getenv('UNSAFIE_KEYSTORE') ?: 'debug.keystore')

android {
    namespace 'com.unsafie.vpn'
    compileSdk 37

    defaultConfig {
        applicationId "com.unsafie.vpn"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "0.1.0"

        buildConfigField "String", "UPDATE_BASEURL", "\"${dotenvValue('UPDATE_BASEURL')}\""
        buildConfigField "String", "UPDATE_TOKEN", "\"${dotenvValue('UPDATE_TOKEN')}\""
        buildConfigField "String", "EDGE_HOSTS", "\"${dotenvValue('EDGE_HOSTS')}\""
    }

    if (releaseKeystore.exists()) {
        signingConfigs {
            release {
                storeFile releaseKeystore
                storePassword System.getenv('UNSAFIE_KEYSTORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('UNSAFIE_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('UNSAFIE_KEY_PASSWORD') ?: 'android'
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    buildTypes {
        release {
            if (releaseKeystore.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation project(':core')

    kotlinCompilerClasspath 'org.jetbrains.kotlin:kotlin-compiler-embeddable:2.4.0'

    implementation platform('androidx.compose:compose-bom:2026.06.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
