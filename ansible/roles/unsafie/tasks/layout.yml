- name: Create the unsafie group
  ansible.builtin.group:
    name: "{{ unsafie_group }}"
    system: true

- name: Create the unsafie user
  ansible.builtin.user:
    name: "{{ unsafie_user }}"
    group: "{{ unsafie_group }}"
    home: "{{ unsafie_home }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: true

- name: Create directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(unsafie_user) }}"
    group: "{{ item.group | default(unsafie_group) }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "{{ unsafie_home }}" }
    - { path: "{{ unsafie_home }}/chats" }
    - { path: "{{ unsafie_home }}/claude" }
    - { path: "{{ unsafie_cache_dir }}", mode: "0700" }
    - { path: "{{ unsafie_config_dir }}", owner: root, group: "{{ unsafie_group }}", mode: "0750" }

- name: Install system dependencies
  ansible.builtin.apt:
    name:
      - git
      - curl
      - ca-certificates
      - build-essential
      - libpq5
    state: present
    update_cache: true
    cache_valid_time: 3600
