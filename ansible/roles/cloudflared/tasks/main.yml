- name: package
  ansible.builtin.apt:
    deb: "{{ cloudflared_deb_url }}"
  notify: restart cloudflared

- name: user
  ansible.builtin.user:
    name: "{{ cloudflared_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: config dir
  ansible.builtin.file:
    path: "{{ cloudflared_config_dir }}"
    state: directory
    owner: root
    group: "{{ cloudflared_user }}"
    mode: "0750"

- name: credentials
  ansible.builtin.template:
    src: credentials.json.j2
    dest: "{{ cloudflared_config_dir }}/{{ cloudflared_tunnel_id }}.json"
    owner: root
    group: "{{ cloudflared_user }}"
    mode: "0640"
  notify: restart cloudflared

- name: config
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ cloudflared_config_dir }}/config.yml"
    owner: root
    group: "{{ cloudflared_user }}"
    mode: "0640"
  notify: restart cloudflared

- name: unit
  ansible.builtin.template:
    src: cloudflared.service.j2
    dest: /etc/systemd/system/cloudflared.service
    mode: "0644"
  notify:
    - daemon reload
    - restart cloudflared

- name: service
  ansible.builtin.systemd:
    name: cloudflared
    state: started
    enabled: true
    daemon_reload: true
