- name: acme webroot
  ansible.builtin.file:
    path: /var/www/acme
    state: directory
    mode: "0755"

- name: nginx
  ansible.builtin.include_role:
    name: geerlingguy.nginx
  vars:
    nginx_listen_ipv6: false
    nginx_remove_default_vhost: true
    nginx_worker_processes: auto
    nginx_worker_connections: 1024
    nginx_keepalive_timeout: 65
    nginx_client_max_body_size: 64m
    nginx_server_tokens: "off"
    nginx_log_format: >-
      escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id","method":"$request_method","host":"$host","uri":"$request_uri","status":"$status","bytes":"$body_bytes_sent","referer":"$http_referer","user_agent":"$http_user_agent","request_time":"$request_time","upstream_time":"$upstream_response_time","traceparent":"$http_traceparent"}'
    nginx_access_log: "/var/log/nginx/access.log main buffer=16k flush=5s"
    nginx_extra_http_options: |
      gzip on;
      gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
      gzip_min_length 1024;
    nginx_vhosts:
      - listen: "80 default_server"
        server_name: _
        filename: 000-default.conf
        extra_parameters: |
          location /.well-known/acme-challenge/ { root /var/www/acme; }
          location / { return 444; }
      - listen: "127.0.0.1:8080"
        server_name: status
        filename: status.conf
        extra_parameters: |
          location = /stub_status { stub_status; }
          location / { return 404; }

- name: flush
  ansible.builtin.meta: flush_handlers

- name: cert exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
  register: cert

- name: reload nginx before certbot
  ansible.builtin.service:
    name: nginx
    state: reloaded
  when: not cert.stat.exists

- name: certbot
  ansible.builtin.include_role:
    name: geerlingguy.certbot
  vars:
    certbot_install_method: package
    certbot_auto_renew: true
    certbot_auto_renew_user: root
    certbot_auto_renew_hour: "3"
    certbot_auto_renew_minute: "30"
    certbot_auto_renew_options: "--quiet --deploy-hook 'systemctl reload nginx'"
    certbot_create_if_missing: true
    certbot_create_method: webroot
    certbot_webroot: /var/www/acme
    certbot_admin_email: "{{ admin_email }}"
    certbot_certs: "{{ domains | map('split', ',') | map('community.general.dict_kv', 'domains') | list }}"

- name: teapot page
  ansible.builtin.copy:
    dest: /var/www/teapot.html
    mode: "0644"
    content: |
      <html>
      <head><title>418 I'm a Teapot</title></head>
      <body>
      <center><h1>418 I'm a Teapot</h1></center>
      <hr><center>No frontend served here. Bring your own UI.</center>
      </body>
      </html>

- name: domain vhost
  ansible.builtin.copy:
    dest: "/etc/nginx/sites-enabled/{{ domain }}.conf"
    mode: "0644"
    content: |
      server {
          listen 80;
          server_name {{ domain }};
          location /.well-known/acme-challenge/ { root /var/www/acme; }
          location / { return 301 https://$host$request_uri; }
      }
      server {
          listen 443 ssl;
          http2 on;
          server_name {{ domain }};
          ssl_certificate /etc/letsencrypt/live/{{ domain }}/fullchain.pem;
          ssl_certificate_key /etc/letsencrypt/live/{{ domain }}/privkey.pem;
          error_page 418 /teapot.html;
          location = /teapot.html { root /var/www; internal; }
          location / { return 418; }
      }
  notify: reload nginx
