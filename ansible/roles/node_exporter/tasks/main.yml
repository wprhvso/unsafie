- name: node_exporter
  ansible.builtin.include_role:
    name: prometheus.prometheus.node_exporter
  vars:
    node_exporter_web_listen_address: 127.0.0.1:9100
    node_exporter_textfile_dir: /var/lib/node_exporter/textfile_collector
    node_exporter_enabled_collectors:
      - systemd
      - processes
      - tcpstat
      - filesystem:
          mount-points-exclude: "^/(dev|proc|run|sys|var/lib/docker)($|/)"
          fs-types-exclude: "^(autofs|binfmt_misc|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$"
    node_exporter_disabled_collectors:
      - arp
      - bcache
      - bonding
      - btrfs
      - edac
      - entropy
      - fibrechannel
      - hwmon
      - infiniband
      - ipvs
      - mdadm
      - nfs
      - nfsd
      - nvme
      - powersupplyclass
      - rapl
      - selinux
      - tapestats
      - thermal_zone
      - xfs
      - zfs
