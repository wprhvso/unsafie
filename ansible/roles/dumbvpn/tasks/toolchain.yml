- name: packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - unzip
      - zip
      - ca-certificates
      - jq
      - "{{ dumbvpn_jdk_package }}"
    state: present
    lock_timeout: 300

- name: go releases
  ansible.builtin.uri:
    url: https://go.dev/dl/?mode=json&include=all
    return_content: true
  register: go_dl

- name: go checksum
  ansible.builtin.set_fact:
    go_checksum: >-
      {{ go_dl.json
         | selectattr('version', 'eq', 'go' ~ dumbvpn_go_version)
         | map(attribute='files') | first
         | selectattr('os', 'eq', 'linux')
         | selectattr('arch', 'eq', 'amd64')
         | selectattr('kind', 'eq', 'archive')
         | map(attribute='sha256') | first }}

- name: go archive
  ansible.builtin.get_url:
    url: "https://dl.google.com/go/go{{ dumbvpn_go_version }}.linux-amd64.tar.gz"
    dest: "/var/cache/dumbvpn-toolchain/go{{ dumbvpn_go_version }}.linux-amd64.tar.gz"
    checksum: "sha256:{{ go_checksum }}"
    mode: "0644"
  register: go_archive

- name: go installed version
  ansible.builtin.command: /usr/local/go/bin/go version
  register: go_installed
  changed_when: false
  failed_when: false

- name: go
  when: "('go' ~ dumbvpn_go_version ~ ' ') not in (go_installed.stdout | default(''))"
  block:
    - name: remove previous go
      ansible.builtin.file:
        path: /usr/local/go
        state: absent

    - name: unpack go
      ansible.builtin.unarchive:
        src: "{{ go_archive.dest }}"
        dest: /usr/local
        remote_src: true

- name: just archive
  ansible.builtin.get_url:
    url: "https://github.com/casey/just/releases/download/{{ dumbvpn_just_version }}/just-{{ dumbvpn_just_version }}-x86_64-unknown-linux-musl.tar.gz"
    dest: "/var/cache/dumbvpn-toolchain/just-{{ dumbvpn_just_version }}.tar.gz"
    checksum: "sha256:https://github.com/casey/just/releases/download/{{ dumbvpn_just_version }}/SHA256SUMS"
    mode: "0644"
  register: just_archive

- name: just installed version
  ansible.builtin.command: /usr/local/bin/just --version
  register: just_installed
  changed_when: false
  failed_when: false

- name: just
  when: "('just ' ~ dumbvpn_just_version) not in (just_installed.stdout | default(''))"
  block:
    - name: unpack just
      ansible.builtin.unarchive:
        src: "{{ just_archive.dest }}"
        dest: /var/cache/dumbvpn-toolchain
        remote_src: true
        include: [just]

    - name: install just
      ansible.builtin.copy:
        src: /var/cache/dumbvpn-toolchain/just
        dest: /usr/local/bin/just
        mode: "0755"
        remote_src: true

- name: gradle checksum
  ansible.builtin.uri:
    url: "https://services.gradle.org/distributions/gradle-{{ dumbvpn_gradle_version }}-bin.zip.sha256"
    return_content: true
  register: gradle_sha

- name: gradle archive
  ansible.builtin.get_url:
    url: "https://services.gradle.org/distributions/gradle-{{ dumbvpn_gradle_version }}-bin.zip"
    dest: "/var/cache/dumbvpn-toolchain/gradle-{{ dumbvpn_gradle_version }}-bin.zip"
    checksum: "sha256:{{ gradle_sha.content | string | regex_search('[0-9a-f]{64}') }}"
    mode: "0644"
  register: gradle_archive

- name: unpack gradle
  ansible.builtin.unarchive:
    src: "{{ gradle_archive.dest }}"
    dest: /opt
    remote_src: true
    creates: "/opt/gradle-{{ dumbvpn_gradle_version }}/bin/gradle"

- name: gradle symlink
  ansible.builtin.file:
    src: "/opt/gradle-{{ dumbvpn_gradle_version }}"
    dest: /opt/gradle
    state: link

- name: android sdk dir
  ansible.builtin.file:
    path: "{{ dumbvpn_android_sdk }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: android cmdline-tools archive
  ansible.builtin.get_url:
    url: "https://dl.google.com/android/repository/commandlinetools-linux-{{ dumbvpn_android_cmdline_tools_build }}_latest.zip"
    dest: "/var/cache/dumbvpn-toolchain/commandlinetools-linux-{{ dumbvpn_android_cmdline_tools_build }}.zip"
    mode: "0644"
  register: cmdline_tools_archive

- name: unpack cmdline-tools
  ansible.builtin.unarchive:
    src: "{{ cmdline_tools_archive.dest }}"
    dest: /var/cache/dumbvpn-toolchain
    remote_src: true
    creates: /var/cache/dumbvpn-toolchain/cmdline-tools/bin/sdkmanager

- name: cmdline-tools into the sdk
  ansible.builtin.copy:
    src: /var/cache/dumbvpn-toolchain/cmdline-tools/
    dest: "{{ dumbvpn_android_sdk }}/cmdline-tools/latest/"
    remote_src: true
    mode: preserve

- name: android licenses
  ansible.builtin.shell: |
    set -uo pipefail
    yes 2>/dev/null | {{ dumbvpn_android_sdk }}/cmdline-tools/latest/bin/sdkmanager --sdk_root={{ dumbvpn_android_sdk }} --licenses > /dev/null
    rc=${PIPESTATUS[1]}
    exit "$rc"
  args:
    executable: /bin/bash
    creates: "{{ dumbvpn_android_sdk }}/licenses/android-sdk-license"
  environment:
    JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

- name: android sdk components
  ansible.builtin.command:
    cmd: >-
      {{ dumbvpn_android_sdk }}/cmdline-tools/latest/bin/sdkmanager
      --sdk_root={{ dumbvpn_android_sdk }}
      platform-tools
      "platforms;{{ dumbvpn_android_platform }}"
      "build-tools;{{ dumbvpn_android_build_tools }}"
      "ndk;{{ dumbvpn_android_ndk }}"
    creates: "{{ dumbvpn_android_sdk }}/ndk/{{ dumbvpn_android_ndk }}/source.properties"
  environment:
    JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  register: sdk_components
  failed_when: sdk_components.rc != 0 or 'Failed to find package' in sdk_components.stderr
