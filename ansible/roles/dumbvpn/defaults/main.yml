dumbvpn_repo: https://github.com/wprhvso/dumbvpn.git
dumbvpn_github_repo: wprhvso/dumbvpn
dumbvpn_branch: main

dumbvpn_domain: "dumb.{{ domain }}"
dumbvpn_relay_host: "relay.{{ domain }}"

dumbvpn_relay_port: 8443

dumbvpn_home: /var/lib/dumbvpn
dumbvpn_etc: /etc/dumbvpn

dumbvpn_tls_dir: "{{ dumbvpn_etc }}/tls"
dumbvpn_relay_cert: "{{ dumbvpn_tls_dir }}/relay.crt"
dumbvpn_relay_key: "{{ dumbvpn_tls_dir }}/relay.key"
dumbvpn_relay_cert_days: 3650

dumbvpn_update_addr: 127.0.0.1:8087
dumbvpn_hook_addr: 127.0.0.1:8090
dumbvpn_hook_path: /hooks/github

dumbvpn_keep_releases: 5
dumbvpn_build_timeout: 1h

dumbvpn_go_version: 1.26.3
dumbvpn_just_version: 1.44.0
dumbvpn_gradle_version: 9.5.0
dumbvpn_jdk_package: openjdk-17-jdk-headless

dumbvpn_android_sdk: /opt/android-sdk
dumbvpn_android_cmdline_tools_build: "13114758"
dumbvpn_android_platform: android-37.2
dumbvpn_android_build_tools: 37.0.0
dumbvpn_android_ndk: 26.3.11579264

dumbvpn_release_key: "{{ vault_dumbvpn_release_key }}"
dumbvpn_webhook_secret: "{{ vault_dumbvpn_webhook_secret }}"
dumbvpn_github_app_id: "{{ vault_dumbvpn_github_app_id | default('') | string }}"
dumbvpn_github_app_private_key: "{{ vault_dumbvpn_github_app_private_key | default('') }}"
