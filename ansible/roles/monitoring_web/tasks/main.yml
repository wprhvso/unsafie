- name: passlib
  ansible.builtin.apt:
    name: python3-passlib
    state: present

- name: basic auth
  community.general.htpasswd:
    path: /etc/nginx/.htpasswd-monitoring
    name: admin
    password: "{{ vault_monitoring_basic_auth_password }}"
    owner: root
    group: www-data
    mode: "0640"

- name: vhosts
  ansible.builtin.copy:
    dest: "/etc/nginx/sites-enabled/{{ item.name }}.{{ domain }}.conf"
    mode: "0644"
    content: |
      server {
          listen 80;
          server_name {{ item.name }}.{{ domain }};
          location / { return 301 https://$host$request_uri; }
      }
      server {
          listen 443 ssl;
          http2 on;
          server_name {{ item.name }}.{{ domain }};
          include {{ tls_snippet }};
          auth_basic "monitoring";
          auth_basic_user_file /etc/nginx/.htpasswd-monitoring;
          {% if item.home is defined %}
          location = / { return 302 {{ item.home }}; }
          {% endif %}
          location / {
              proxy_pass http://127.0.0.1:{{ item.port }};
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
              proxy_buffering off;
              proxy_read_timeout 600s;
          }
      }
  loop:
    - { name: metrics, port: 8428, home: /vmui/ }
    - { name: logs, port: 9428, home: /select/vmui/ }
    - { name: traces, port: 10428, home: /select/vmui/ }
    - { name: alertmanager, port: 9093 }
  notify: reload nginx
