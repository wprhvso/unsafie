- name: ensure docker is installed
  ansible.builtin.apt:
    name:
      - docker.io
    state: present

- name: ensure docker service is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: install kameleo systemd unit
  ansible.builtin.template:
    src: kameleo.service.j2
    dest: /etc/systemd/system/kameleo.service
    owner: root
    group: root
    mode: "0644"
  notify: restart kameleo

- name: enable and start kameleo
  ansible.builtin.systemd:
    name: kameleo
    enabled: true
    state: started
    daemon_reload: true
