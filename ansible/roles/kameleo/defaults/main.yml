kameleo_port: 5050
kameleo_pat: "{{ vault_kameleo_pat | default('') }}"
kameleo_data_volume: kameleo-data
kameleo_docker_image: kameleo/kameleo-app:latest
kasmvnc_version: "1.5.0"
kasmvnc_codename: "{{ ansible_distribution_release if ansible_distribution_release in ['noble', 'jammy', 'focal', 'bookworm', 'trixie', 'bullseye'] else ('noble' if ansible_distribution == 'Ubuntu' else 'bookworm') }}"
