- name: disable ubuntu motd scripts
  ansible.builtin.file:
    path: "/etc/update-motd.d/{{ item }}"
    mode: "0644"
  loop:
    - 10-help-text
    - 50-motd-news
    - 80-esm
    - 90-updates-available
    - 91-contract-ua-esm-status
    - 95-hwe-eol
  failed_when: false

- name: motd-news off
  ansible.builtin.lineinfile:
    path: /etc/default/motd-news
    regexp: ^ENABLED=
    line: ENABLED=0

- name: motd
  ansible.builtin.copy:
    dest: /etc/motd
    mode: "0644"
    content: |

      {{ domain }}
