name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: sync
        run: uv sync --all-packages

      - name: ruff
        run: uv run ruff check .

      - name: types
        run: uv run basedpyright

      - name: the sdk, the prompt and the python tool hold together
        run: |
          uv run python -c "
          import unsafie_sdk
          from unsafie.agent.prompt import SYSTEM_PROMPT
          from unsafie.agent.request import PYTHON_TOOL, tools
          missing = [name for name in unsafie_sdk.__all__ if not hasattr(unsafie_sdk, name)]
          assert not missing, missing
          description = PYTHON_TOOL['description']
          for word in ('chat.send(', 'pages.create(', 'machines.run(', 'packages.install(',
                       'github.use', 'browser.shot'):
              assert word in description, word
          assert PYTHON_TOOL['input_schema']['required'] == ['code']
          assert 'code' in PYTHON_TOOL['input_schema']['properties']
          assert [t.get('name') for t in tools()][0] == 'python'
          assert 'chat.send(' in SYSTEM_PROMPT
          assert not any(hasattr(unsafie_sdk, gone) for gone in
                         ('say', 'file', 'photo', 'note', 'store', 'ci', 'automation', 'fetch',
                          'net', 'run', 'take', 'install'))
          print('tool', len(description), 'chars; prompt', len(SYSTEM_PROMPT), 'chars')
          "

      - name: migrations match the models
        run: uv run python -c "import unsafie.database.models"
