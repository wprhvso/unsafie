name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: sync
        run: uv sync --all-packages

      - name: ruff
        run: uv run ruff check .

      - name: types
        run: uv run basedpyright

      - name: the cli answers
        run: |
          uv run unsafie version
          uv run unsafie help >/dev/null
          uv run unsafie help --json | python -c "import json,sys; json.load(sys.stdin)"
          uv run unsafie completion bash >/dev/null

      - name: migrations match the models
        run: uv run python -c "import unsafie.database.models"
