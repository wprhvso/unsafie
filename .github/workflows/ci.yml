name: ci

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: sync
        run: uv sync --all-packages

      - name: ruff
        run: uv run ruff check .

      - name: types
        run: uv run basedpyright

      - name: cli and prompt hold together
        run: |
          uv run python -c "
          from unsafie.cli.main import main
          from unsafie.agent.prompt import SYSTEM_PROMPT
          assert 'unsafie chat send' in SYSTEM_PROMPT
          assert 'unsafie stop' in SYSTEM_PROMPT
          print('prompt', len(SYSTEM_PROMPT), 'chars')
          "

      - name: migrations match the models
        run: uv run python -c "import unsafie.database.models"
