name: unsafie

on:
  workflow_dispatch:

jobs:
  machine:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: mark the start
        run: echo "UNSAFIE_BOOT_STARTED=$(date +%s)" >>"$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: point the tools at the caches
        env:
          CACHE_URL: ${{ secrets.UNSAFIE_CACHE_URL }}
        run: |
          if [ -z "$CACHE_URL" ]; then
            echo "no cache configured, everything comes from upstream"
            exit 0
          fi
          {
            echo "UV_INDEX_URL=$CACHE_URL/pypi/simple"
            echo "PIP_INDEX_URL=$CACHE_URL/pypi/simple"
            echo "npm_config_registry=$CACHE_URL/npm"
          } >>"$GITHUB_ENV"
          echo "cache: $CACHE_URL"

      - name: install unsafie
        env:
          SPEC: ${{ secrets.UNSAFIE_SDK_SPEC }}
          WIRE: ${{ secrets.UNSAFIE_WIRE_SPEC }}
        run: |
          TARGET="${SPEC:-git+https://github.com/wprhvso/unsafie@main#subdirectory=python}"
          TARGET="${TARGET//python\/unsafie-sdk/python}"
          TARGET="${TARGET//unsafie-sdk/unsafie}"
          uv tool install "$TARGET" || uv tool install git+https://github.com/wprhvso/unsafie@main#subdirectory=python
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: bring the tools along
        run: |
          BIN="$(command -v unsafie-machine || command -v unsafie)"
          sudo -E env "PATH=$PATH" "$BIN" setup tools
      - name: serve
        env:
          UNSAFIE_API: ${{ secrets.UNSAFIE_URL }}
          UNSAFIE_WORKER_TOKEN: ${{ secrets.UNSAFIE_WORKER_TOKEN }}
          UNSAFIE_CACHE_URL: ${{ secrets.UNSAFIE_CACHE_URL }}
        run: |
          BIN="$(command -v unsafie-machine || command -v unsafie)"
          sudo -E env "PATH=$PATH" "UNSAFIE_BOOT_STARTED=$UNSAFIE_BOOT_STARTED" \
            "$BIN" serve
