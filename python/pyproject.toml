[project]
name = "unsafie"
version = "0.1.0"
description = "unsafie"
readme = "README.md"
authors = [{ name = "wprhvso", email = "wprhvso@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "aiohttp>=3.14.0",
    "alembic>=1.19.1",
    "asyncssh>=2.19.0",
    "fastapi>=0.141.1",
    "fluent.runtime>=0.4.0",
    "pyjwt[crypto]>=2.10.0",
    "pynacl>=1.5.0",
    "llmmd>=0.1.7",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation>=0.65b0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "redis[hiredis]>=8.1.0",
    "sqlalchemy>=2.0.52",
    "unsafie-wire",
    "uvicorn>=0.52.4",
    "websockets[standard]>=17.1",
    "charset-normalizer>=3.5.1",
    "defusedxml>=0.7.1",
    "lxml>=6.1",
    "mammoth>=1.12",
    "markdownify>=1.2",
    "odfdo>=3.24",
    "pillow>=12.3",
    "pypdfium2>=5.13",
    "python-calamine>=0.8.2",
    "python-pptx>=1.0.2",
    "striprtf>=0.0.33",
]

[project.scripts]
unsafie-server = "unsafie:main"
unsafie = "unsafie.cli.main:main"
unsafie-machine = "unsafie.cli.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "unsafie"
module-root = ""

[tool.uv.workspace]
members = ["unsafie-wire"]

[tool.uv.sources]
unsafie-wire = { workspace = true }

[dependency-groups]
dev = ["basedpyright>=1.39", "ruff>=0.16"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body", "fastapi.Path"]

[tool.ruff.lint.isort]
known-first-party = ["unsafie", "unsafie_wire"]
