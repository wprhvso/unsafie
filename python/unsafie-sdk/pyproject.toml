[project]
name = "unsafie-sdk"
version = "0.1.0"
description = "The unsafie SDK: what the agent writes and a human can import, plus the machine runtime"
readme = "README.md"
authors = [{ name = "wprhvso", email = "wprhvso@gmail.com" }]
requires-python = ">=3.14"
keywords = ["unsafie", "telegram", "automation", "github-actions", "chrome", "repl"]
dependencies = ["unsafie-wire"]

[project.scripts]
unsafie-machine = "unsafie_sdk.machine.__main__:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "unsafie_sdk"

[tool.uv.sources]
unsafie-wire = { workspace = true }
